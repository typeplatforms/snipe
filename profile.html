<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="icon" type="image/png" href="assets/snipe-logo.png">
  <title>Snipe Profile</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <main class="auth-shell">
    <div class="auth-bg"></div>
    <section class="panel" style="width:min(560px,100%);text-align:center">
      <a class="brand" href="index.html" aria-label="Snipe home" style="justify-content:center;margin-bottom:20px"><img src="assets/snipe-logo.png" alt="Snipe" style="width:29px;height:29px;object-fit:contain;border-radius:8px;"><span>SNIPE</span></a>
      <div id="profile-avatar" class="dash-avatar" style="margin:0 auto">?</div>
      <h1 id="profile-name" style="font:700 36px 'Space Grotesk',sans-serif;letter-spacing:-.05em;margin:16px 0 3px">Loading…</h1>
      <div id="profile-username" class="dash-handle">@—</div>
      <div id="profile-badges" style="display:flex;justify-content:center;gap:7px;margin:16px 0"></div>
      <p id="profile-bio" class="muted" style="line-height:1.6;font-size:13px">Loading profile…</p>
      <div id="links" style="display:grid;gap:8px;margin-top:22px"></div>
      <div id="views" class="muted" style="margin-top:22px;font-size:10px">— views</div>
      <a href="index.html" class="auth-back" style="display:block;margin-top:24px">← Snipe</a>
    </section>
  </main>
  <script type="module" src="./js/profile.js"></script>
</body>
</html>
