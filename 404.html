<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="icon" type="image/png" href="/snipe/assets/snipe-logo.png">
  <title>Snipe Profile</title>
  <link rel="stylesheet" href="/snipe/app.css">
  <style>
    html,body{min-height:100%;margin:0}body{background:#07080b}.profile-page{min-height:100vh;display:grid;place-items:center;padding:40px 20px;position:relative;overflow:hidden}.profile-page::before{content:"";position:absolute;width:650px;height:650px;border-radius:50%;background:#d7ff4f;opacity:.035;filter:blur(120px);top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none}.profile-card-public{position:relative;z-index:1;width:min(560px,100%);padding:34px;border:1px solid rgba(255,255,255,.09);border-radius:22px;background:linear-gradient(145deg,rgba(255,255,255,.045),rgba(255,255,255,.012)),#0b0d11;box-shadow:0 35px 100px rgba(0,0,0,.55);text-align:center}.profile-brand{display:flex;align-items:center;justify-content:center;gap:9px;margin-bottom:26px;color:#f5f6f8;font:700 15px 'Space Grotesk',sans-serif;letter-spacing:.16em}.profile-brand img{width:32px;height:32px;object-fit:contain;border-radius:8px}.public-avatar{width:92px;height:92px;margin:0 auto;display:grid;place-items:center;border:4px solid #15181e;border-radius:50%;background:#15181e;color:#d7ff4f;font:700 30px 'Space Grotesk',sans-serif;overflow:hidden}.public-avatar img{width:100%;height:100%;object-fit:cover}#profile-name{font:700 38px 'Space Grotesk',sans-serif;letter-spacing:-.055em;margin:18px 0 3px;color:#f5f6f8}#profile-username{color:#777d88;font-size:12px}#profile-badges{display:flex;justify-content:center;flex-wrap:wrap;gap:7px;margin:18px 0}#profile-bio{max-width:470px;margin:0 auto;color:#a7abb4;line-height:1.7;font-size:13px}#links{display:grid;gap:9px;margin-top:24px}#links a{transition:transform .18s ease,border-color .18s ease,background .18s ease}#links a:hover{transform:translateY(-2px);border-color:rgba(215,255,79,.22)!important;background:rgba(215,255,79,.035)!important;color:#f5f6f8!important}#views{margin-top:22px;color:#656b76;font-size:10px}.profile-back{display:inline-block;margin-top:24px;color:#777d88;font-size:11px}@media(max-width:600px){.profile-page{padding:20px 14px}.profile-card-public{padding:26px 18px;border-radius:18px}#profile-name{font-size:31px}}
  </style>
</head>
<body>
  <main class="profile-page">
    <section class="profile-card-public">
      <a class="profile-brand" href="/snipe/" aria-label="Snipe home"><img src="/snipe/assets/snipe-logo.png" alt="Snipe"><span>SNIPE</span></a>
      <div id="profile-avatar" class="public-avatar">?</div>
      <h1 id="profile-name">Loading…</h1>
      <div id="profile-username">@—</div>
      <div id="profile-badges"></div>
      <p id="profile-bio">Loading profile…</p>
      <div id="links"></div>
      <div id="views">— views</div>
      <a href="/snipe/" class="profile-back">← Snipe</a>
    </section>
  </main>
  <script type="module" src="/snipe/js/profile.js"></script>
</body>
</html>
