<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Log in — Snipe</title><link rel="stylesheet" href="auth.css"></head><body><main class="auth-shell"><div class="auth-bg"></div><section class="auth-card"><div class="auth-top"><a class="brand" href="index.html"><span class="brand-mark">S</span><span>SNIPE</span></a><a class="auth-back" href="index.html">← Home</a></div><h1 class="auth-title">Welcome back.</h1><p class="auth-subtitle">Log in to manage your Snipe profile.</p><div id="message" class="auth-message"></div><form id="login-form"><label class="field"><span>Email</span><input id="email" type="email" autocomplete="email" required placeholder="you@example.com"></label><label class="field"><span>Password</span><input id="password" type="password" autocomplete="current-password" required placeholder="Your password"></label><button id="submit" class="auth-submit" type="submit">Log in</button></form><div class="auth-switch">Don't have an account? <a href="signup.html">Create one</a></div></section></main><script type="module" src="./js/login.js"></script></body></html>
