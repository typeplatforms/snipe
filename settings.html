<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Settings — Snipe</title><link rel="stylesheet" href="app.css"></head><body><div class="app-shell"><header class="app-nav"><div class="app-nav-inner"><a class="brand" href="index.html"><span class="brand-mark">S</span><span>SNIPE</span></a><nav class="app-nav-links"><a href="dashboard.html">Dashboard</a><a class="active" href="settings.html">Settings</a><a id="public-nav" href="profile.html">My profile</a></nav><div class="user-menu"><div id="nav-avatar" class="mini-avatar">?</div><button id="logout" class="logout">Log out</button></div></div></header><main class="app-main"><div class="page-head"><div><h1>Settings</h1><p>Control the identity people see on your Snipe profile.</p></div></div><section class="panel"><h2>Profile</h2><p class="panel-desc">Your username is public. Social links and customization will expand here as Snipe grows.</p><form id="settings-form"><div class="form-grid"><label class="field-app"><span>Username</span><input id="username" readonly></label><label class="field-app"><span>Display name</span><input id="display_name" maxlength="64" placeholder="Your display name"></label><label class="field-app full"><span>Bio</span><textarea id="bio" maxlength="500" placeholder="Tell people a little about yourself."></textarea></label><label class="field-app"><span>Discord</span><input id="discord_url" type="url" placeholder="https://discord.com/users/..."></label><label class="field-app"><span>GitHub</span><input id="github_url" type="url" placeholder="https://github.com/..."></label><label class="field-app"><span>YouTube</span><input id="youtube_url" type="url" placeholder="https://youtube.com/..."></label><label class="field-app"><span>Twitter / X</span><input id="twitter_url" type="url" placeholder="https://x.com/..."></label><label class="field-app"><span>Instagram</span><input id="instagram_url" type="url" placeholder="https://instagram.com/..."></label><label class="field-app"><span>TikTok</span><input id="tiktok_url" type="url" placeholder="https://tiktok.com/@..."></label></div><button class="save-btn" id="save" type="submit">Save changes</button><div id="status" class="status"></div></form></section></main></div><script type="module" src="./js/settings.js"></script></body></html>
