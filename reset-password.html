<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#08090d">
  <link rel="icon" type="image/png" href="assets/snipe-logo.png">
  <title>Reset password — Snipe</title>
  <link rel="stylesheet" href="auth.css">
</head>
<body>
  <main class="auth-shell">
    <div class="auth-card">
      <div class="auth-top">
        <a class="brand" href="index.html" aria-label="Snipe home"><img src="assets/snipe-logo.png" alt="Snipe" style="width:29px;height:29px;object-fit:contain;border-radius:8px;"><span>SNIPE</span></a>
        <a class="auth-back" href="login.html">Back to login</a>
      </div>
      <h1 class="auth-title" id="title">Reset your password.</h1>
      <p class="auth-subtitle" id="subtitle">Enter your email and we'll send you a secure password reset link.</p>
      <form id="reset-form">
        <label class="field" id="email-field"><span>Email</span><input id="email" type="email" autocomplete="email" required></label>
        <label class="field" id="password-field" hidden><span>New password</span><input id="password" type="password" minlength="8" autocomplete="new-password"></label>
        <div id="message" class="auth-message"></div>
        <button class="auth-submit" id="send" type="submit">Send reset link</button>
      </form>
      <div class="auth-switch"><a href="signup.html">Create an account</a></div>
    </div>
  </main>
  <script type="module" src="./js/reset-password.js"></script>
</body>
</html>
